name: CI

# Runs on every push and pull request: checks the code and runs all the tests.
# The Android APK is built only when you ask for it: open the Actions tab, pick
# "CI", press "Run workflow" and tick "Build the APK".
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build the APK
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    # Only when started by hand with "Build the APK" ticked, and after the tests pass.
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      # Signed with the debug key for now, so this APK is for testing only,
      # not for the Play Store. There is no backend yet, so the app runs on its
      # built-in sample data (USE_MOCK=true, sign in with OTP 1234).
      # When the backend exists, switch to USE_MOCK=false and pass API_BASE_URL.
      - name: Build APK
        run: flutter build apk --release --dart-define=USE_MOCK=true

      - name: Keep the APK
        uses: actions/upload-artifact@v5
        with:
          name: fresh-hen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
