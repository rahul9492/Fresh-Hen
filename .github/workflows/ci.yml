name: CI

# Runs on every push and pull request: checks the code and runs all the tests.
# On the main branch it also builds an Android APK you can download and install.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    # Only after the tests pass, and only for the main branch.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Get packages
        run: flutter pub get

      # Signed with the debug key for now, so this APK is for testing only,
      # not for the Play Store. There is no backend yet, so the app runs on its
      # built-in sample data (USE_MOCK=true, sign in with OTP 1234).
      # When the backend exists, switch to USE_MOCK=false and pass API_BASE_URL.
      - name: Build APK
        run: flutter build apk --release --dart-define=USE_MOCK=true

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: fresh-hen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
