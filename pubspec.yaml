name: fresh_hen
description: "FreshHen - fresh chicken ordering app."
publish_to: 'none' # Private app, never published to pub.dev

# versionName+versionCode (e.g. 1.0.0+1)
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # --- UI ---
  cupertino_icons: ^1.0.8 # iOS style icons
  google_fonts: ^8.2.1 # Custom fonts from Google Fonts

  # --- State management ---
  flutter_riverpod: ">=3.0.0 <4.0.0" # App state and dependency injection
  riverpod_annotation: ">=3.0.0 <5.0.0" # Annotations for riverpod code generation

  # --- Navigation ---
  go_router: ^18.0.2 # Declarative routing and deep links

  # --- Networking ---
  dio: ^5.11.1 # HTTP client with interceptors

  # --- Storage ---
  shared_preferences: ^2.5.5 # Simple key-value storage for settings
  flutter_secure_storage: ^11.2.0 # Encrypted storage for auth tokens

  # --- Models and serialization ---
  freezed_annotation: ^3.1.0 # Annotations for immutable data classes
  json_annotation: ^4.12.0 # Annotations for JSON parsing

  # --- Utilities ---
  intl: ^0.20.3 # Date, number and currency formatting
  image_picker: ^1.2.3
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3
  font_awesome_flutter: ^11.0.0
  share_plus: ^13.3.1
  gal: ^2.3.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  cached_network_image: ^4.0.4
  lottie: ^3.6.1
  file_saver: ^0.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Linting ---
  flutter_lints: ^6.0.0 # Recommended lint rules (see analysis_options.yaml)

  # --- Code generation ---
  build_runner: ^2.16.1 # Runs all code generators
  riverpod_generator: ^4.0.9 # Generates riverpod providers
  freezed: ^4.0.2 # Generates immutable models
  json_serializable: ^6.14.1 # Generates JSON to/from code

  # --- Assets tooling ---
  flutter_launcher_icons: ^0.14.4 # Generates app icons
  flutter_native_splash: ^2.4.7 # Generates native splash screen

flutter:
  uses-material-design: true # Enables Material icons
  assets:
    - assets/images/ # App images
    - assets/fonts/ # Noto Sans for PDF invoices (has the ₹ sign)
    - assets/lottie/ # Animated bottom-nav icons

# App icon config (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true # iOS rejects icons with transparency
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

# Splash config (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/icon/splash.png
  image_dark: assets/icon/splash.png
  android_12: # Android 12+ uses its own splash API
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"
    image: assets/icon/splash.png
    image_dark: assets/icon/splash.png
